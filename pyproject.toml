[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "house-scrapers"
version = "0.1.0"
description = "A small collection of website-specific housing scrapers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.17,<2",
    "azure-storage-blob>=12.22,<13",
    "beautifulsoup4>=4.13,<5",
    "boto3>=1.35,<2",
    "playwright>=1.45,<2",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
house-scrapers = "house_scrapers.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
house_scrapers = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["live: requires network access and a browser"]
