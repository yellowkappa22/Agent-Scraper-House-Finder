<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1ea">
    <title>Oxford House Search</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">Agent Scraper House Finder</p>
        <h1>Oxford House Search</h1>
      </div>
      <div class="snapshot">
        <span class="live-dot"></span>
        <span id="snapshot-time">Loading latest results…</span>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="Dashboard controls">
        <label class="search">
          <span>Search</span>
          <input id="search" type="search" placeholder="Address, source or description">
        </label>
        <label>
          <span>Maximum rent</span>
          <select id="rent-filter">
            <option value="Infinity">Any rent</option>
            <option value="800">Up to £800</option>
            <option value="900">Up to £900</option>
            <option value="1000">Up to £1,000</option>
            <option value="1100">Up to £1,100</option>
            <option value="1200">Up to £1,200</option>
          </select>
        </label>
        <label>
          <span>Rank by</span>
          <select id="sort-order">
            <option value="recent">Newest first</option>
            <option value="rent">Lowest rent</option>
          </select>
        </label>
        <button id="show-handled" class="quiet-button" type="button">Show history</button>
      </section>

      <div id="error" class="notice hidden" role="alert"></div>

      <section class="dashboard-grid">
        <section class="result-section">
          <div class="section-heading tab-heading">
            <div>
              <p class="eyebrow">New matches</p>
              <div class="result-tabs" role="tablist" aria-label="Result type">
                <button class="result-tab active" type="button" role="tab"
                        aria-selected="true" data-result-tab="couples">
                  Couples supported <span id="couples-count" class="tab-count">0</span>
                </button>
                <button class="result-tab" type="button" role="tab"
                        aria-selected="false" data-result-tab="self_contained">
                  Self-contained <span id="self-contained-count" class="tab-count">0</span>
                </button>
              </div>
            </div>
          </div>
          <div id="new-results" class="card-list"></div>
        </section>

        <section class="result-section process-section">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Your shortlist</p>
              <h2>In process</h2>
            </div>
            <span id="process-count" class="count">0</span>
          </div>
          <fieldset class="process-filters">
            <legend>Filter shortlist status</legend>
            <label><input type="checkbox" value="in_process" data-process-status> In process</label>
            <label><input type="checkbox" value="contacted" data-process-status> Contacted</label>
            <label><input type="checkbox" value="viewing_confirmed" data-process-status> Viewing</label>
            <label><input type="checkbox" value="waiting_for_selection" data-process-status> Waiting</label>
          </fieldset>
          <div id="process-results" class="card-list"></div>
        </section>
      </section>

      <section id="handled-section" class="result-section handled-section hidden">
        <div class="section-heading">
          <div>
            <p class="eyebrow">History</p>
            <h2>Ignored & failed</h2>
          </div>
          <span id="handled-count" class="count">0</span>
        </div>
        <div id="handled-results" class="card-list compact"></div>
      </section>
    </main>

    <div id="toast" class="toast hidden" role="status"></div>
    <dialog id="message-dialog" class="message-dialog">
      <form method="dialog" class="message-dialog-card">
        <div class="message-dialog-heading">
          <h2>Generated message</h2>
          <button class="dialog-close" value="close" aria-label="Close">×</button>
        </div>
        <textarea id="generated-message" rows="10" aria-label="Generated message"></textarea>
        <div class="message-dialog-actions">
          <button id="copy-message" class="primary" type="button">Copy message</button>
          <button value="close">Close</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
